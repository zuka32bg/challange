quarkus.datasource.db-kind=postgresql

#DATABASE
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/challenge}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:root}

#SECURITY
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=false
quarkus.security.users.file.enabled=true
quarkus.security.users.file.realm-name=user-service-realm
quarkus.security.users.file.plain-text=true
quarkus.security.users.file.users=users.properties
quarkus.security.users.file.roles=roles.properties

#SWAGGER
quarkus.smallrye-openapi.info-title=Challenge
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for User data management
quarkus.swagger-ui.always-include=true

#KAFKA
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.user-out.connector=smallrye-kafka
mp.messaging.outgoing.user-out.topic=user-data
mp.messaging.outgoing.user-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.user-in.connector=smallrye-kafka
mp.messaging.incoming.user-in.topic=user-data
mp.messaging.incoming.user-in.value.deserializer=messaging.UserDeserializer
mp.messaging.incoming.user-in.group.id=challenge-consumer
mp.messaging.incoming.user-in.auto.offset.reset=earliest


quarkus.hibernate-orm.database.generation=update
